name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Inject GIPHY key
        env:
          GIPHY_KEY: ${{ secrets.GIPHY_KEY }}
        run: |
          if [ -n "$GIPHY_KEY" ]; then
            sed -i "s/PUT_YOUR_GIPHY_API_KEY_HERE/$GIPHY_KEY/" app/src/main/java/com/example/mykeyboard/Config.kt
          fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyKeyboard-apk
          path: app/build/outputs/apk/debug/app-debug.apk
